name: Saika LINE PHP patch (manual only)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only preflight or upload the three verified PHP files
        type: choice
        required: true
        default: check
        options:
          - check
          - deploy
      confirmation:
        description: For deploy enter DEPLOY-SAIKA-LINE
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: saika-line-php-production
  cancel-in-progress: false
jobs:
  update:
    if: github.actor == 'oosaka0123-sudo'
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ftp.lolipop.jp
      FTP_DIR: /saika/line-api
      FTP_USER: ${{ secrets.SAIKA_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.SAIKA_FTP_PASSWORD }}
    steps:
      - name: Use tested, pinned LINE backend
        uses: actions/checkout@v4
        with:
          ref: a61082fb6c948da41d5116aea219f0de3a462096
          persist-credentials: false
      - name: Verify source and opt-in
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = "deploy" ]; then
            test "$CONFIRMATION" = 'DEPLOY-SAIKA-LINE' || { echo 'Confirmation required'; exit 1; }
          fi
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD" || { echo 'SAIKA_FTP_USER and SAIKA_FTP_PASSWORD secrets are required'; exit 1; }
          for file in line-api/webhook.php line-api/lib/posts.php line-api/lib/messages.php; do
            test -s "$file"
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp php-cli php-mbstring
          php -l line-api/webhook.php
          php -l line-api/lib/posts.php
          php -l line-api/lib/messages.php
      - name: Read-only target verification and runtime backup
        run: |
          set -euo pipefail
          mkdir -p .before/lib
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          cd "$FTP_DIR"
          ls feed.php
          ls private/.htaccess
          get webhook.php -o .before/webhook.php
          get lib/posts.php -o .before/lib/posts.php
          get lib/messages.php -o .before/lib/messages.php
          bye
          LFTP
          test -s .before/webhook.php
          test -s .before/lib/posts.php
          test -s .before/lib/messages.php
          echo 'Three original server files retrieved. No other files accessed for changes.'
      - name: Refuse unreviewed server changes
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '0c3d0b9c1f164560ff79dd1c7ffd7ef12a2d3207419912b437585e727d09d9ce' '.before/webhook.php' \
            '9e04ee2913f3ce82aec034a2b44b092a7383bd8c43d8bfbad809333d7aa153ae' '.before/lib/posts.php' \
            '2267761a2bd90f6407cf8bb0f8cfc5cf23b132267089b4ff005e5a55336eab74' '.before/lib/messages.php' | sha256sum --check --status || {
              echo 'Live PHP differs from the prior reviewed copy; deployment stopped without changes.'
              exit 1
            }
      - name: Upload only the three LINE PHP files
        id: publish
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          cd "$FTP_DIR"
          put line-api/webhook.php -o webhook.php.new-${GITHUB_RUN_ID}
          put line-api/lib/posts.php -o lib/posts.php.new-${GITHUB_RUN_ID}
          put line-api/lib/messages.php -o lib/messages.php.new-${GITHUB_RUN_ID}
          mv webhook.php.new-${GITHUB_RUN_ID} webhook.php
          mv lib/posts.php.new-${GITHUB_RUN_ID} lib/posts.php
          mv lib/messages.php.new-${GITHUB_RUN_ID} lib/messages.php
          bye
          LFTP
      - name: Verify server files, keep existing data intact
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          mkdir -p .after/lib
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          cd "$FTP_DIR"
          get webhook.php -o .after/webhook.php
          get lib/posts.php -o .after/lib/posts.php
          get lib/messages.php -o .after/lib/messages.php
          bye
          LFTP
          cmp line-api/webhook.php .after/webhook.php
          cmp line-api/lib/posts.php .after/lib/posts.php
          cmp line-api/lib/messages.php .after/lib/messages.php
          curl --fail --silent --show-error --max-time 20 --output /dev/null 'https://saika.rss7.net/line-api/feed.php'
          echo 'Verified exactly three updated PHP files and public feed endpoint.'
      - name: Restore original PHP on deployment failure
        if: failure() && steps.publish.outcome != 'skipped' && inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          test -s .before/webhook.php
          test -s .before/lib/posts.php
          test -s .before/lib/messages.php
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:timeout 20
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          cd "$FTP_DIR"
          put .before/webhook.php -o webhook.php
          put .before/lib/posts.php -o lib/posts.php
          put .before/lib/messages.php -o lib/messages.php
          bye
          LFTP
          echo 'Restored the three PHP files. No private data or photos changed.'
